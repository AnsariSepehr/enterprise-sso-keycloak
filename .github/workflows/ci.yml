name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check shell scripts
        run: for f in scripts/*/*.sh tests/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: sudo apt-get install -y shellcheck && shellcheck -x -S warning scripts/*/*.sh tests/*.sh
      - name: Render configs with dummy values (XML and YAML are parsed too)
        run: |
          sudo apt-get install -y gettext-base libxml2-utils
          python3 -m pip install --user pyyaml
          cp config/env/sso.env.example config/env/sso.env
          bash scripts/tools/render-test.sh
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get install -y shellcheck gettext-base libxml2-utils
          python3 -m pip install --user pyyaml
      - name: Offline test suite (XML editor, Nextcloud patch, logout generator, links, secrets)
        run: bash tests/run-tests.sh
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generic secret and private-IP scan
        run: bash scripts/tools/check-secrets.sh
